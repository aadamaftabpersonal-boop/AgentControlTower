[project]
name = "agent-control-tower-backend"
version = "0.1.0"
description = "Backend for Agent Control Tower: ingests Entire checkpoints and serves the control room API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
